# Postgres for local development only. Where this runs in production is the deploy phase's problem.

# Named here rather than after the folder, so a renamed checkout finds the same volume.
name: kinomat

services:
  postgres:
    image: postgres:18-alpine
    container_name: kinomat-postgres
    # Supplied by .env, which is never committed. Compose fails loudly rather than defaulting, so a
    # missing value can never quietly become a password someone else can guess.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - '5432:5432'
    volumes:
      # The path the image itself declares. Postgres 18 keeps its data under /var/lib/postgresql/18,
      # so the /var/lib/postgresql/data of every older example would persist nothing at all here.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # $$ escapes the interpolation, so the container's own shell expands these, not Compose.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
