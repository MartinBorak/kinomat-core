name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, check formatting and typecheck
        run: pnpm run --parallel "/^(lint|format:check|typecheck)$/"

      # Without DATABASE_URL the database tests skip; the job below is what proves the schema.
      - name: Test
        run: pnpm test

  database:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kinomat
          POSTGRES_DB: kinomat
          # Taken from the run rather than written down: this database is reachable from this job alone.
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinomat -d kinomat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://kinomat:${{ github.run_id }}@localhost:5432/kinomat

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate, seed and test against Postgres
        run: pnpm db:setup && pnpm exec vitest run src/db --no-file-parallelism
